<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Para ti 💌</title>
<meta name="description" content="Una cartita con nutrias" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>

  <!-- Fondo con capas de nutrias/burbujas/corazones, siempre presente -->
  <div id="scene" aria-hidden="true">
    <div id="otters-layer"></div>
    <div id="bubbles-layer"></div>
  </div>

  <!-- Música -->
  <audio id="bg-music" src="assets/music.mp3" loop preload="auto"></audio>
  <button id="music-toggle" aria-label="Reproducir música" title="Música">🎵</button>

  <main id="app">

    <!-- Pantalla 1: Sobre -->
    <section id="envelope-screen" class="screen active">
      <div class="envelope-wrap">
        <button class="envelope" id="envelope" aria-label="Abrir carta">
          <div class="envelope-shadow"></div>
          <div class="envelope-back"></div>
          <div class="envelope-letter-peek"></div>
          <div class="envelope-flap"></div>
          <div class="envelope-front-left"></div>
          <div class="envelope-front-right"></div>
          <div class="envelope-seal">
            <svg viewBox="0 0 60 60" class="seal-svg">
              <circle cx="30" cy="30" r="28" fill="#e8657a"/>
              <path d="M30 42c-1 0-1.8-.4-2.6-1.1C21.8 36 15 29.6 15 22.6 15 17.9 18.7 14 23.4 14c2.6 0 5.1 1.3 6.6 3.3C31.5 15.3 34 14 36.6 14 41.3 14 45 17.9 45 22.6c0 7-6.8 13.4-12.4 18.3-.8.7-1.6 1.1-2.6 1.1z" fill="#fff5f2"/>
            </svg>
          </div>
        </button>
        <p class="hint-text">Tengo algo para ti 💌</p>
      </div>
    </section>

    <!-- Pantalla 2: Carta -->
    <section id="letter-screen" class="screen">
      <button id="replay-btn" class="ghost-btn" hidden>↺ Volver a leer</button>

      <div class="paper-wrap">
        <div class="paper">
          <p id="letter-text" class="letter-text"></p>

          <div id="final-area" class="final-area">
            <div id="otter-hug" class="otter-hug" hidden></div>
            <button id="love-btn" class="love-btn" hidden>Te amo 💕</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div id="heart-burst-layer" aria-hidden="true"></div>

  <script src="script.js?v=12"></script>
</body>
</html>
